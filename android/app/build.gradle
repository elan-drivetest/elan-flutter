plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Upload-key signing. android/key.properties is gitignored and points at a
// keystore kept OUTSIDE the repo. Google Play App Signing holds the real app
// signing key; this key only authenticates uploads.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { keystoreProperties.load(it) }
}

android {
    namespace = "com.drivingschool.elan"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion
    //ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.drivingschool.elan"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Never fall back to debug keys: Play rejects debug-signed bundles,
            // and a silent fallback would only surface at upload time.
            // Checked only when a release task is requested, so debug builds
            // still work on machines without the upload key.
            def releaseRequested = gradle.startParameter.taskNames.any {
                it.toLowerCase().contains("release")
            }
            if (releaseRequested && !keystorePropertiesFile.exists()) {
                throw new GradleException(
                    "android/key.properties is missing. Release builds must be " +
                    "signed with the upload key; see docs/PLAY_STORE_RELEASE_PLAN.md.")
            }
            signingConfig = signingConfigs.release
        }
    }
}

flutter {
    source = "../.."
}
